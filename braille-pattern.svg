<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
  <!-- Decorative braille dot grid, subtle background texture -->
  <g fill="#7B6FE8" fill-opacity="0.1">
    <!-- Cell 1 (top-left): dots 1,2,4,5 raised -->
    <circle cx="16" cy="16" r="3"/>
    <circle cx="16" cy="32" r="3"/>
    <circle cx="32" cy="16" r="3"/>
    <circle cx="32" cy="32" r="3"/>
    <!-- Cell 2 (top-right): dots 1,4,6 raised -->
    <circle cx="52" cy="16" r="3"/>
    <circle cx="68" cy="16" r="3"/>
    <circle cx="68" cy="48" r="3"/>
    <!-- Cell 3 (bottom-left): dots 2,3,5 raised -->
    <circle cx="16" cy="52" r="3"/>
    <circle cx="16" cy="68" r="3"/>
    <circle cx="32" cy="52" r="3"/>
    <!-- Cell 4 (bottom-right): dots 1,3,4,6 -->
    <circle cx="52" cy="52" r="3"/>
    <circle cx="52" cy="68" r="3"/>
    <circle cx="68" cy="52" r="3"/>
    <circle cx="68" cy="68" r="3"/>
  </g>
</svg>
